name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install --disable-pip-version-check ruff
      - name: Blocking lint (syntax errors, undefined names)
        run: |
          which ruff 2>&1 | tee lint.log
          ruff --version 2>&1 | tee -a lint.log
          ruff check --isolated --select E9,F63,F7,F82 repanier mysite 2>&1 | tee -a lint.log
          exit ${PIPESTATUS[0]}
      - name: Publish lint log to PR (debug)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -n "$PR_URL" ] && [ -f lint.log ]; then
            { echo "Lint debug log:"; echo '~~~'; cat lint.log; echo '~~~'; } > lint-body.md
            gh pr comment "$PR_URL" --body-file lint-body.md || true
          fi

  django:
    name: Django system and model checks
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: mysite.common_settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/requirement-5.2.txt
      - name: Install dependencies
        run: |
          grep -v '^uWSGI' requirements/requirement-5.2.txt > req-ci.txt
          python -m pip install --disable-pip-version-check -r req-ci.txt 2>&1 | tail -5
      - name: Prepare CI-only settings
        run: |
          cat > mysite/settings.py <<'EOF'
          # CI-only settings module (gitignored). Read first by mysite/common_settings.py,
          # which derives everything else from mysite/mysite.ini.
          from pathlib import Path

          SECRET_KEY = "ci-only-insecure-secret-key"
          EOF
          python - <<'EOF'
          from pathlib import Path

          p = Path("mysite/mysite.ini")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              "[DJANGO_SETTINGS]",
              "[DJANGO_SETTINGS]\nDJANGO_SETTINGS_DATABASE_ENGINE=django.db.backends.sqlite3",
              1,
          )
          p.write_text(text, encoding="utf-8")
          EOF
          head -2 mysite/mysite.ini
          python --version
          pip list 2>/dev/null | head -8
      - name: System checks
        run: |
          python manage.py check 2>&1 | tee check.log
          exit ${PIPESTATUS[0]}
      - name: Model consistency (makemigrations dry-run)
        run: |
          python manage.py makemigrations --dry-run --verbosity 2 2>&1 | tee -a check.log
          exit ${PIPESTATUS[0]}
      - name: Publish job log to PR (debug)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -n "$PR_URL" ] && [ -f check.log ]; then
            { echo "Django debug log:"; echo '~~~'; cat check.log; echo '~~~'; } > django-body.md
            gh pr comment "$PR_URL" --body-file django-body.md || true
          fi
