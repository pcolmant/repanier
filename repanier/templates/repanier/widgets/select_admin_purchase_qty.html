{% load i18n %}
{% spaceless %}
{% with name=widget.name %}
<select name="{{ name }}"{% include "django/forms/widgets/attrs.html" %} onchange="{{ name }}_select(this.value)">{% for group_name, group_choices, group_index in widget.optgroups %}{% if group_name %}
  <optgroup label="{{ group_name }}">{% endif %}{% for option in group_choices %}
  {% include option.template_name with widget=option %}{% endfor %}{% if group_name %}
  </optgroup>{% endif %}{% endfor %}
</select>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        {{ name }}_select("{{ widget.value|first }}");
    });

    function {{ name }}_select(value) {
        const setDisplay = (selector, show) => {
            document.querySelectorAll(selector).forEach(el => {
                el.style.display = show ? '' : 'none';
            });
        };

        switch (value) {
            {{ case_show_show }}
                setDisplay("div.form-row.field-quantity_ordered", true);
                setDisplay("div.form-row.field-quantity_invoiced", true);
                break;
            {{ case_show_hide }}
                setDisplay("div.form-row.field-quantity_ordered", true);
                setDisplay("div.form-row.field-quantity_invoiced", false);
                break;
            {{ case_hide_show }}
                setDisplay("div.form-row.field-quantity_ordered", false);
                setDisplay("div.form-row.field-quantity_invoiced", true);
                break;
        }
    }
</script>
{% endwith %}
{% endspaceless %}
