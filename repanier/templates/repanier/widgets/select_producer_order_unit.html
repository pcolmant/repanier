{% load i18n %}
{% spaceless %}
{% with id=widget.attrs.id name=widget.name %}
<div id="{{ id }}_dropdown" class="btn-group float-start btn-group-form">
    <button id="{{ id }}_button_label" class="btn btn-success" type="button"></button>
    <button class="btn btn-success dropdown-toggle dropdown-toggle-split" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        <span class="visually-hidden">Toggle Dropdown</span>
    </button>
    <ul class="dropdown-menu">
        {% for group, options, index in widget.optgroups %}
            {% for option in options %}
               <li>
                   <a class="dropdown-item" href="javascript:{{ name }}_select('{{ option.value }}', '{{ option.label }}')" data-value="{{ option.value }}"{% include "django/forms/widgets/attrs.html" with widget=option %}>{{ option.label }}</a>
               </li>
            {% endfor %}
        {% endfor %}
    </ul>
    <input type="hidden" id="{{ id }}" name="{{ name }}" value=""/>
    <script>
    {{ name }}_select('{{ repanier_selected_value }}', '{{ repanier_selected_label }}');
    function {{ name }}_select(value, label) {
         const inputEl = document.getElementById('{{ id }}');
         if (inputEl) {
             inputEl.value = value;
         }
         const labelEl = document.getElementById('{{ id }}_button_label');
         if (labelEl) {
             labelEl.innerHTML = label;
         }

         const setHtml = (selector, html) => {
             document.querySelectorAll(selector).forEach(el => el.innerHTML = html);
         };

         const setDisplay = (selector, show) => {
             document.querySelectorAll(selector).forEach(el => {
                 el.style.display = show ? '' : 'none';
             });
         };

         switch(value) {
             case '115':
                 // OrderUnit.PC_PRICE_PC
                 setHtml('span[id=customer_increment_order_quantity_label]', "{% translate 'Conditioned by' %}");
                 setHtml('span[id=customer_increment_order_quantity_addon]', "{% translate 'pc(s)' %}");
                 setHtml('span[id=stock_label]', "{% translate 'Stock' %}");
                 setHtml('span[id=stock_addon]', "{% translate 'pc(s)' %}");
                 setHtml('span[id=producer_unit_price_addon]', "{% translate '/ pc' %}");
                 setDisplay('div[id=div_id_order_average_weight]', false);
                 setDisplay('div[id=div_id_unit_deposit]', true);
                 break;
             case '105':
                 // OrderUnit.PC_PRICE_KG
                 setHtml('span[id=customer_increment_order_quantity_label]', "{% translate 'Conditioned by' %}");
                 setHtml('span[id=customer_increment_order_quantity_addon]', "{% translate 'kg(s)' %}");
                 setHtml('span[id=stock_label]', "{% translate 'Stock' %}");
                 setHtml('span[id=stock_addon]', "{% translate 'kg(s)' %}");
                 setHtml('span[id=producer_unit_price_addon]', "{% translate '/ kg' %}");
                 setDisplay('div[id=div_id_order_average_weight]', false);
                 setDisplay('div[id=div_id_unit_deposit]', true);
                 break;
             case '110':
                 // OrderUnit.PC_PRICE_LT
                 setHtml('span[id=customer_increment_order_quantity_label]', "{% translate 'Conditioned by' %}");
                 setHtml('span[id=customer_increment_order_quantity_addon]', "{% translate 'l(s)' %}");
                 setHtml('span[id=stock_label]', "{% translate 'Stock' %}");
                 setHtml('span[id=stock_addon]', "{% translate 'l(s)' %}");
                 setHtml('span[id=producer_unit_price_addon]', "{% translate '/ l' %}");
                 setDisplay('div[id=div_id_order_average_weight]', false);
                 setDisplay('div[id=div_id_unit_deposit]', true);
                 break;
             case '140':
                 // OrderUnit.PC_KG
                 setHtml('span[id=customer_increment_order_quantity_label]', "{% translate 'Conditioned by' %}");
                 setHtml('span[id=customer_increment_order_quantity_addon]', "{% translate 'pc(s)' %}");
                 setHtml('span[id=stock_label]', "{% translate 'Stock' %}");
                 setHtml('span[id=stock_addon]', "{% translate 'pc(s)' %}");
                 setHtml('span[id=producer_unit_price_addon]', "{% translate '/ kg' %}");
                 setDisplay('div[id=div_id_order_average_weight]', true);
                 setDisplay('div[id=div_id_unit_deposit]', false);
                 break;
        }
    }
    </script>
</div>
{% endwith %}
{% endspaceless %}
