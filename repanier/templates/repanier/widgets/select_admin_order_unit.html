{% load i18n %}
{% spaceless %}
<select name="{{ widget.name }}"{% include "django/forms/widgets/attrs.html" %} onchange="{{ widget.name }}_select(this.value)">{% for group_name, group_choices, group_index in widget.optgroups %}{% if group_name %}
  <optgroup label="{{ group_name }}">{% endif %}{% for option in group_choices %}
  {% include option.template_name with widget=option %}{% endfor %}{% if group_name %}
  </optgroup>{% endif %}{% endfor %}
</select>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        {{ widget.name }}_select("{{ widget.value|first }}");
    });

    function {{ widget.name }}_select(value) {
        const setDisplay = (selector, show) => {
            document.querySelectorAll(selector).forEach(el => {
                el.style.display = show ? '' : 'none';
            });
        };

        const setHtml = (selector, html) => {
            document.querySelectorAll(selector).forEach(el => {
                el.innerHTML = html;
            });
        };

        switch (value) {
            case "100":
                setDisplay("div.fieldBox.field-unit_deposit", true);
                setDisplay("div.fieldBox.field-order_average_weight", false);
                setDisplay("div.fieldBox.field-customer_minimum_order_quantity", true);
                setDisplay("div.fieldBox.field-customer_increment_order_quantity", false);
                setDisplay("div.form-row.field-customer_minimum_order_quantity", false);
                setDisplay("div.form-row.field-customer_increment_order_quantity", false);
                setDisplay("div.fieldBox.field-customer_unit_price", true);
                setDisplay("div.form-row.field-wrapped", false);
                break;
            case "105":
            case "110":
            case "115":
                setDisplay("div.fieldBox.field-unit_deposit", true);
                setDisplay("div.fieldBox.field-order_average_weight", true);
                setDisplay("div.fieldBox.field-customer_minimum_order_quantity", true);
                setDisplay("div.fieldBox.field-customer_increment_order_quantity", false);
                setDisplay("div.form-row.field-customer_minimum_order_quantity", true);
                setDisplay("div.form-row.field-customer_increment_order_quantity", false);
                setDisplay("div.fieldBox.field-customer_unit_price", true);
                setDisplay("div.form-row.field-wrapped", false);
                break;
            case "140":
                setDisplay("div.fieldBox.field-unit_deposit", false);
                setDisplay("div.fieldBox.field-order_average_weight", true);
                setDisplay("div.fieldBox.field-customer_minimum_order_quantity", true);
                setDisplay("div.fieldBox.field-customer_increment_order_quantity", true);
                setDisplay("div.form-row.field-customer_minimum_order_quantity", true);
                setDisplay("div.form-row.field-customer_increment_order_quantity", true);
                setDisplay("div.fieldBox.field-customer_unit_price", true);
                setDisplay("div.form-row.field-wrapped", true);
                break;
            case "120":
            case "150":
                setDisplay("div.fieldBox.field-unit_deposit", false);
                setDisplay("div.fieldBox.field-order_average_weight", false);
                setDisplay("div.fieldBox.field-customer_minimum_order_quantity", true);
                setDisplay("div.fieldBox.field-customer_increment_order_quantity", true);
                setDisplay("div.form-row.field-customer_minimum_order_quantity", true);
                setDisplay("div.form-row.field-customer_increment_order_quantity", true);
                setDisplay("div.fieldBox.field-customer_unit_price", true);
                setDisplay("div.form-row.field-wrapped", true);
                break;
            case "300":
            case "400":
                setDisplay("div.fieldBox.field-unit_deposit", false);
                setDisplay("div.fieldBox.field-order_average_weight", false);
                setDisplay("div.fieldBox.field-customer_minimum_order_quantity", false);
                setDisplay("div.fieldBox.field-customer_increment_order_quantity", false);
                setDisplay("div.form-row.field-customer_minimum_order_quantity", false);
                setDisplay("div.form-row.field-customer_increment_order_quantity", false);
                setDisplay("div.fieldBox.field-customer_unit_price", false);
                setDisplay("div.form-row.field-wrapped", false);
                break;
        }

        switch (value) {
            case "105":
                setHtml("div.fieldBox.field-order_average_weight label", "{% translate 'Piece weight in kg' %}");
                break;
            case "110":
                setHtml("div.fieldBox.field-order_average_weight label", "{% translate 'Piece content in l' %}");
                break;
            case "115":
                setHtml("div.fieldBox.field-order_average_weight label", "{% translate 'Number of pieces in a pack' %}");
                break;
            case "140":
                setHtml("div.fieldBox.field-order_average_weight label", "{% translate 'Average weight in kg of a piece' %}");
                break;
        }

        switch (value) {
            case "100":
            case "105":
            case "110":
                setHtml("div.fieldBox.field-producer_unit_price label", "{% translate 'Producer price for one piece' %}");
                setHtml("div.fieldBox.field-customer_unit_price label", "{% translate 'Customer price for one piece' %}");
                setHtml("div.fieldBox.field-customer_minimum_order_quantity label", "{% translate 'Minimum order quantity expressed as number of pieces' %}");
                break;
            case "115":
                setHtml("div.fieldBox.field-producer_unit_price label", "{% translate 'Producer price for one pack' %}");
                setHtml("div.fieldBox.field-customer_unit_price label", "{% translate 'Customer price for one pack' %}");
                setHtml("div.fieldBox.field-customer_minimum_order_quantity label", "{% translate 'Minimum order quantity expressed in number of pack(s)' %}");
                break;
            case "120":
                setHtml("div.fieldBox.field-producer_unit_price label", "{% translate 'Producer price for one kg' %}");
                setHtml("div.fieldBox.field-customer_unit_price label", "{% translate 'Customer price for one kg' %}");
                setHtml("div.fieldBox.field-customer_minimum_order_quantity label", "{% translate 'Minimum order quantity in kg (0.05 = 50 grams)' %}");
                break;
            case "140":
                setHtml("div.fieldBox.field-producer_unit_price label", "{% translate 'Producer price for one kg' %}");
                setHtml("div.fieldBox.field-customer_unit_price label", "{% translate 'Customer price for one kg' %}");
                setHtml("div.fieldBox.field-customer_minimum_order_quantity label", "{% translate 'Minimum order quantity expressed as number of pieces' %}");
                break;
            case "150":
                setHtml("div.fieldBox.field-producer_unit_price label", "{% translate 'Producer price for one l' %}");
                setHtml("div.fieldBox.field-customer_unit_price label", "{% translate 'Customer price for one l' %}");
                setHtml("div.fieldBox.field-customer_minimum_order_quantity label", "{% translate 'Minimum order quantity expressed in ℓ (0.75 = 75 cℓ)' %}");
                break;
            case "300":
                setHtml("div.fieldBox.field-producer_unit_price label", "{% translate 'Producer price for one deposit' %}");
                break;
            case "400":
                setHtml("div.fieldBox.field-producer_unit_price label", "{% translate 'Producer price for one subscription' %}");
                break;
        }
    }
</script>
{% endspaceless %}
