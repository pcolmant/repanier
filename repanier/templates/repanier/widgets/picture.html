{% load i18n static %}
{% spaceless %}
{% with id=widget.attrs.id name=widget.name %}
    <div id="{{ id }}_file_dropbox">
        {% if bootstrap %}
            <a id="{{ id }}_file_select" style="display:{{ repanier_display_picture }}" target="_blank" href="{{ repanier_file_url }}">
                <img id="{{ id }}_file_img" src="{{ repanier_file_url }}" class="img-fluid img-thumbnail m-1" style="min-height:32px; min-width:32px; max-height:225px; max-width:225px;">
            </a>
            <p id="{{ id }}_file_remove_container" style="display:{{ repanier_display_picture }}"><a id="{{ id }}_file_remove" class="btn btn-danger" href="#remove">{% translate "Remove" %}</a></p>
            <input id="{{ id }}_file_elem" type="file" style="display:none" accept="image/*"/>
            <a href="#" id="{{ id }}_file_elem_select" class="btn btn-success" style="display:{{ repanier_display_upload }}"><span class="bi bi-camera" aria-hidden="true"></span></a>
        {% else %}
            <a id="{{ id }}_file_select" style="display:{{ repanier_display_picture }}" target="_blank" href="{{ repanier_file_url }}">
                <img id="{{ id }}_file_img" src="{{ repanier_file_url }}" style="min-height:32px; min-width:32px; max-height:225px; max-width:225px;">
            </a>
            <button id="{{ id }}_file_remove" style="display:{{ repanier_display_picture }}">{% translate "Remove" %}&nbsp;<img id="id_picture_clear" src="{% static "admin/img/icon-deletelink.svg" %}" height="10" width="10"></button>
            <input id="{{ id }}_file_elem" type="file" style="display:none" accept="image/*"/>
            <button id="{{ id }}_file_elem_select" style="display:{{ repanier_display_upload }}">{% translate "Select a picture" %}</button>
        {% endif %}
        <input id="{{ id }}" type="hidden" value="{{ repanier_file_path }}" name="{{ name }}" />
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const fileSelect = document.getElementById("{{ id }}_file_select");
            const fileElem = document.getElementById("{{ id }}_file_elem");
            const fileElemSelect = document.getElementById("{{ id }}_file_elem_select");
            const fileImg = document.getElementById("{{ id }}_file_img");
            const fileDropbox = document.getElementById("{{ id }}_file_dropbox");
            const fileRemove = document.getElementById("{{ id }}_file_remove");
            const fileRemoveContainer = document.getElementById("{{ id }}_file_remove_container");
            const filePath = document.getElementById("{{ id }}");

            function getCsrftoken() {
                let csrftoken = null;
                if (document.cookie && document.cookie !== '') {
                    const cookies = document.cookie.split(';');
                    for (let i = 0; i < cookies.length; i++) {
                        const cookie = cookies[i].trim();
                        if (cookie.substring(0, 10) === ('csrftoken=')) {
                            csrftoken = decodeURIComponent(cookie.substring(10));
                            break;
                        }
                    }
                }
                return csrftoken;
            }

            function cancel(e) {
                e.stopPropagation();
                if (e.preventDefault) { e.preventDefault(); }
                return false;
            }

            function handleFiles(files) {
                if (!files || files.length === 0) return;
                const file = files[0];
                const imageType = /^image\//;
                if (!imageType.test(file.type)) {
                    alert('{% translate "File is not an image" %}');
                    return;
                }

                const reader = new FileReader();
                reader.onloadend = function() {
                    const img = new Image();
                    img.src = reader.result;

                    let doNotWaitForever = setTimeout(function(){
                        clearInterval(waitUntilImgLoaded);
                        alert('{% translate "Processing this image takes too much time" %}');
                    }, 10000);

                    let doNotDoItTwice = 0;
                    let waitUntilImgLoaded = setInterval(function () {
                        if (img.complete && ++doNotDoItTwice === 1) {
                            clearTimeout(doNotWaitForever);
                            clearInterval(waitUntilImgLoaded);

                            const canvas = document.createElement('canvas');
                            const context = canvas.getContext("2d");
                            const MAX_WIDTH = {{ repanier_width }};
                            const MAX_HEIGHT = {{ repanier_height }};
                            let width = img.width;
                            let height = img.height;

                            if (width > height) {
                                if (width > MAX_WIDTH) {
                                    height *= MAX_WIDTH / width;
                                    width = MAX_WIDTH;
                                }
                            } else {
                                if (height > MAX_HEIGHT) {
                                    width *= MAX_HEIGHT / height;
                                    height = MAX_HEIGHT;
                                }
                            }
                            canvas.width = width;
                            canvas.height = height;
                            canvas.style.visibility = "hidden";

                            context.drawImage(img, 0, 0, width, height);

                            let dataURL = (file.type === 'image/png') ? canvas.toDataURL("image/png") : canvas.toDataURL("image/jpeg", 0.9);

                            let byteString = (dataURL.split(',')[0].indexOf('base64') >= 0) ? atob(dataURL.split(',')[1]) : unescape(dataURL.split(',')[1]);
                            let mimeString = dataURL.split(',')[0].split(':')[1].split(';')[0];
                            let length = byteString.length;
                            let ia = new Uint8Array(length);
                            for (let i = 0; i < length; i++) {
                                ia[i] = byteString.charCodeAt(i);
                            }

                            const fileResized = new Blob([ia], {type: mimeString});
                            const formData = new FormData();
                            formData.append('file', fileResized, file.name);

                            const csrftoken = getCsrftoken();

                            fetch("{{ upload_url }}", {
                                method: "POST",
                                headers: {
                                    "X-CSRFToken": csrftoken
                                },
                                body: formData,
                                credentials: 'same-origin'
                            })
                            .then(response => {
                                if (!response.ok) {
                                    if (response.status === 403) {
                                        return response.json().then(errData => { throw new Error(errData.error); });
                                    }
                                    throw new Error(response.statusText);
                                }
                                return response.json();
                            })
                            .then(result => {
                                let msg = "";
                                Object.entries(result).forEach(([key, val]) => {
                                    if (key === 'url') {
                                        if (fileSelect) fileSelect.href = val;
                                        if (fileImg) fileImg.src = val;
                                    } else if (key === 'filename') {
                                        if (filePath) filePath.value = val;
                                    } else {
                                        msg = val;
                                    }
                                });

                                if (fileElem) fileElem.value = "";
                                if (fileSelect) fileSelect.style.display = 'inline';
                                if (fileRemove) fileRemove.style.display = 'inline';
                                if (fileRemoveContainer) fileRemoveContainer.style.display = 'inline';
                                if (fileElem) fileElem.style.display = 'none';
                                if (fileElemSelect) fileElemSelect.style.display = 'none';

                                if (msg !== "") {
                                    alert(msg);
                                }
                            })
                            .catch(error => {
                                alert(error.message || error);
                            });
                        }
                    }, 100);
                };
                reader.readAsDataURL(file);
            }

            if (fileRemove) {
                fileRemove.addEventListener('click', function(e) {
                    cancel(e);
                    if (fileSelect) fileSelect.style.display = 'none';
                    if (fileRemove) fileRemove.style.display = 'none';
                    if (fileRemoveContainer) fileRemoveContainer.style.display = 'none';
                    if (fileElemSelect) fileElemSelect.style.display = 'inline';
                    if (filePath) filePath.value = "";
                });
            }

            if (fileElem) {
                fileElem.addEventListener('change', function(e) {
                    cancel(e);
                    handleFiles(this.files);
                });
            }

            if (fileElemSelect) {
                fileElemSelect.addEventListener('click', function(e) {
                    cancel(e);
                    if (fileElem) fileElem.click();
                });
            }

            if (fileDropbox) {
                fileDropbox.addEventListener('dragenter', cancel);
                fileDropbox.addEventListener('dragover', cancel);
                fileDropbox.addEventListener('drop', function(e) {
                    cancel(e);
                    if (e.dataTransfer && e.dataTransfer.files) {
                        handleFiles(e.dataTransfer.files);
                    }
                });
            }
        });
    </script>
{% endwith %}
{% endspaceless %}
