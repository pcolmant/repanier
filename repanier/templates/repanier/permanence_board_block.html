{% load i18n %}{% if has_entries %}<div id="id_hide_board_{{ permanence_id }}" style="display:block;" class="repanier-button-row">
    <a class="repanier-a-tooltip repanier-a-info" href="#" data-repanier-tooltip="{% translate 'Show' %}"
            onclick="document.getElementById('id_show_board_{{ permanence_id }}').style.display = 'block'; document.getElementById('id_hide_board_{{ permanence_id }}').style.display = 'none'; return false;">
        <i
                class="far fa-eye"></i> {{ msg_len }}</a>
</div>
<div id="id_show_board_{{ permanence_id }}" style="display:none;" class="repanier-button-row">
    <a class="repanier-a-tooltip repanier-a-info" href="#" data-repanier-tooltip="{% translate 'Hide' %}"
            onclick="document.getElementById('id_show_board_{{ permanence_id }}').style.display = 'none'; document.getElementById('id_hide_board_{{ permanence_id }}').style.display = 'block'; return false;">
        <i
                class="far fa-eye-slash"></i></a>
    <p></p><div class="wrap-text">{{ board_html }}</div>
</div>
{% else %}<div class="wrap-text">{% translate "No task" %}</div>
{% endif %}
