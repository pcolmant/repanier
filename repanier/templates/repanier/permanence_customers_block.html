{% load i18n %}{% if customers_html %}<div id="id_hide_customers_{{ permanence_id }}" style="display:;" class="repanier-button-row">{{ button_download }}{{ button_add }}
    <a class="repanier-a-tooltip repanier-a-info" href="#" data-repanier-tooltip="{% translate 'Show' %}"
            onclick="document.getElementById('id_show_customers_{{ permanence_id }}').style.display = 'block'; document.getElementById('id_hide_customers_{{ permanence_id }}').style.display = 'none'; return false;">
        <i
                class="far fa-eye"></i> {{ len_customers }}</a>
</div>
<div id="id_show_customers_{{ permanence_id }}" style="display:none;" class="repanier-button-row">{{ button_download }}{{ button_add }}
    <a class="repanier-a-tooltip repanier-a-info" href="#" data-repanier-tooltip="{% translate 'Hide' %}"
            onclick="document.getElementById('id_show_customers_{{ permanence_id }}').style.display = 'none'; document.getElementById('id_hide_customers_{{ permanence_id }}').style.display = ''; return false;">
        <i
                class="far fa-eye-slash"></i></a>
    <p></p><div class="wrap-text">{{ customers_html }}</div>
</div>
{% elif button_add %}<div class="repanier-button-row">{{ button_add }}</div><p></p><div class="wrap-text">{% translate "No purchase" %}</div>
{% else %}<div class="wrap-text">{% translate "No purchase" %}</div>
{% endif %}
