{% extends "admin/change_form.html" %}
{% load cms_tags menu_tags i18n l10n static %}

{% block breadcrumbs %}
    <div class="breadcrumbs">
        {% translate 'Manage' %}
        &rsaquo;
        <a href="{{ breadcrumb_url }}">{{ model_verbose_name_plural }}</a>
        &rsaquo;
        {{ permanence }}
    </div>
{% endblock %}

{% block content %}
    <div id="content-main">
        <form action="{{ form_url }}" method="post" id="repanier_confirm_action_form">{% csrf_token %}
            <h1>{{ permanence }}</h1>
            <p>{{ sub_title }}</p>
            <div class="submit-row">
                <input type="submit" name="apply" value="{% translate "Yes, I'm sure" %}" class="default">
                <input type="submit" name="cancel" value="{% translate "No, cancel the action" %}">
            </div>
            <input type="hidden" name="{{ action_checkbox_name }}" value="{{ permanence.id|unlocalize }}"/>
            <input type="hidden" name="action" value="{{ action }}"/>
        </form>
    </div>
{% endblock %}
