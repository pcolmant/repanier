{% load i18n %}
{% spaceless %}
    {% with id=widget.attrs.id name=widget.name %}
        <a id="{{ id }}" class="btn btn-outline-primary btn-sm" href="#" role="button"
           onclick="{{ id }}_test_mail_config();return false;">{% translate "Send a test email" %}</a>

        <script>
            function getCsrftoken_{{ id }}() {
                let cookieValue = null;
                if (document.cookie && document.cookie !== '') {
                    const cookies = document.cookie.split(';');
                    for (let i = 0; i < cookies.length; i++) {
                        const cookie = cookies[i].trim();
                        if (cookie.substring(0, 10) === ('csrftoken=')) {
                            cookieValue = decodeURIComponent(cookie.substring(10));
                            break;
                        }
                    }
                }
                return cookieValue;
            }

            function {{ id }}_test_mail_config() {
                const btn = document.getElementById('{{ id }}');
                if (btn) {
                    btn.innerHTML = '{% translate "Please wait..." %}';
                }

                const emailInput = document.getElementById("id_email");
                const id_email = emailInput ? emailInput.value : '';
                const lien = '{% url 'repanier:test_mail_config_ajax' %}';
                const csrftoken = getCsrftoken_{{ id }}();

                fetch(lien, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'X-CSRFToken': csrftoken
                    },
                    body: new URLSearchParams({
                        'id': '{{ id }}',
                        'id_email': id_email
                    }),
                    cache: 'no-store',
                    credentials: 'same-origin'
                })
                .then(response => response.json())
                .then(result => {
                    Object.entries(result).forEach(([key, val]) => {
                        document.querySelectorAll(key).forEach(el => {
                            el.innerHTML = val;
                        });
                    });
                })
                .catch(error => console.error('Error testing mail config:', error));
            }
        </script>
    {% endwith %}
{% endspaceless %}
