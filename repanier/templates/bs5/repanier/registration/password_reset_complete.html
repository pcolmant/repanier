{% extends "bs5/base.html" %}{% load cms_tags i18n %}
{% block title %}{{ title }}{% endblock %}
{% block base_content %}
<div id="content-main" class="container-repanier py-4">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-header bg-light">
            <h4 class="card-title mb-0">{{ title }}</h4>
          </div>
          <div class="card-body">
              <p class="mb-4">{% translate "Your password has been set.  You may go ahead and log in now." %}</p>
              <a href="{% url "repanier:login_form" %}" class="btn btn-info text-white">{% translate 'Sign in' %}</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
