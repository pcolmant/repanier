{% load i18n %}
<ul class="nav flex-column">
    {% for item in items %}
        {% if item.is_separator %}
            <li class="my-2"><hr class="dropdown-divider"></li>
        {% else %}
            <li class="nav-item">
                <a href="{{ item.url }}"
                   class="nav-link {% if item.selected %}bs-docs-sidebar-active text-success fw-bold{% else %}text-dark fw-normal{% endif %}">
                    {{ item.title |safe }}
                </a>
            </li>
        {% endif %}
    {% endfor %}

    {% if request.user.is_authenticated and request.user.customer_id %}
        <li class="my-2"><hr class="dropdown-divider"></li>
        <li class="nav-item">
            <a href="{% url 'repanier:customer_invoice_view' 0 request.user.customer_id %}"
               class="nav-link text-dark fw-normal">
                {{ my_balance|safe }}
            </a>
        </li>
    {% endif %}
</ul>
